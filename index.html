<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Scanner | Free AI Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mb-2 gradient-text">ATS Resume Scanner</h1>
        <p class="text-gray-600">Beat the bot. Check your match score instantly.</p>
    </div>

    <div class="glass shadow-2xl rounded-2xl p-6 w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="flex flex-col">
            <label class="font-semibold text-gray-700 mb-2">1. Paste Resume Text</label>
            <textarea id="resumeText" class="w-full h-64 p-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Paste your full resume here..."></textarea>
        </div>

        <div class="flex flex-col">
            <label class="font-semibold text-gray-700 mb-2">2. Paste Job Description</label>
            <textarea id="jobText" class="w-full h-64 p-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none resize-none" placeholder="Paste the job listing here..."></textarea>
        </div>

    </div>

    <button onclick="scanResume()" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 text-lg">
        RUN SCAN 🚀
    </button>

    <div id="resultsArea" class="hidden w-full max-w-4xl mt-8 bg-white rounded-xl shadow-xl overflow-hidden">
        <div class="p-8 text-center border-b border-gray-100">
            <h2 class="text-gray-500 text-sm uppercase tracking-wide font-semibold">Match Score</h2>
            <div id="scoreDisplay" class="text-6xl font-black text-gray-900 mt-2">0%</div>
            <p id="scoreMessage" class="text-gray-500 mt-2">...</p>
        </div>

        <div class="p-8 bg-red-50">
            <h3 class="text-red-700 font-bold text-lg mb-4 flex items-center">
                ⚠️ MISSING KEYWORDS (Add these!)
            </h3>
            <div id="missingKeywords" class="flex flex-wrap gap-2">
                </div>
        </div>

        <div class="bg-gray-900 text-white p-6 text-center">
            <p class="text-lg mb-2">Resume score under 80%? You will likely be rejected.</p>
            <a href="YOUR_PAYMENT_LINK_HERE" target="_blank" class="inline-block bg-yellow-400 text-gray-900 font-bold py-2 px-6 rounded hover:bg-yellow-300 transition">
                ⚡ Get the "Auto-Fix" Career Bundle (₹1499)
            </a>
        </div>
    </div>

    <script>
        // THE LOGIC (Simple Keyword Matching - No API Needed)
        function scanResume() {
            const resume = document.getElementById('resumeText').value.toLowerCase();
            const job = document.getElementById('jobText').value.toLowerCase();
            
            if (!resume || !job) { alert("Please paste both texts!"); return; }

            // 1. Extract potential keywords from Job Description (Words > 4 chars, ignored common words)
            const stopWords = ["experience", "working", "knowledge", "skills", "ability", "requirements", "please", "contact", "email", "their", "will", "with", "that", "this", "from", "have", "they"];
            const rawWords = job.match(/\b[a-z]{4,}\b/g) || [];
            
            // Filter distinct relevant words (Primitive but effective ATS simulation)
            const uniqueJobWords = [...new Set(rawWords)].filter(w => !stopWords.includes(w));
            
            let matchCount = 0;
            let missing = [];

            // 2. Check if resume has them
            uniqueJobWords.forEach(word => {
                if (resume.includes(word)) {
                    matchCount++;
                } else {
                    missing.push(word);
                }
            });

            // 3. Calculate Score
            let score = 0;
            if (uniqueJobWords.length > 0) {
                score = Math.round((matchCount / uniqueJobWords.length) * 100);
            }

            // 4. Update UI
            const resultArea = document.getElementById('resultsArea');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const missingDiv = document.getElementById('missingKeywords');
            const msg = document.getElementById('scoreMessage');

            resultArea.classList.remove('hidden');
            scoreDisplay.innerText = score + "%";
            
            // Color Logic
            if(score > 75) { scoreDisplay.style.color = "#10B981"; msg.innerText = "Great job! You are likely to pass."; }
            else if(score > 50) { scoreDisplay.style.color = "#F59E0B"; msg.innerText = "Decent, but needs optimization."; }
            else { scoreDisplay.style.color = "#EF4444"; msg.innerText = "Critical: Your resume is invisible to bots."; }

            // Show Top 15 Missing Keywords
            missingDiv.innerHTML = "";
            missing.slice(0, 15).forEach(word => {
                const span = document.createElement('span');
                span.className = "bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-medium border border-red-200 capitalize";
                span.innerText = word;
                missingDiv.appendChild(span);
            });

            // Scroll to results
            resultArea.scrollIntoView({behavior: "smooth"});
        }
    </script>
</body>
</html>
